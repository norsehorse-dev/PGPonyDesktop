name: Release

# Cut a release by pushing a version tag:
#   git tag v1.0.0 && git push origin v1.0.0
#
# CI builds the two installers that need a machine you do not have — the .deb on Ubuntu and the
# .msi on Windows — and opens a DRAFT release with them attached. The macOS .dmg, every PGP
# signature and the SHA256SUMS manifest are made on Kevin's Mac and attached by hand, then the
# draft is published. RELEASING.md has the local half.
#
# This split is the plan of record (§D0-5: "CI producing unsigned artifacts, signing done locally
# at release time"), and it is the reason this repository holds NO secrets. The Developer ID
# certificate never reaches a hosted runner, and neither does the PGP release key — which for an
# OpenPGP application signing its own releases is the whole point. A fully automated pipeline is
# possible and was written first; it was dropped deliberately, not for lack of trying.
#
# The workflow triggers only on tag pushes. There is nothing secret here for a fork PR to reach,
# but keep it that way regardless.

on:
  push:
    tags:
      - 'v*'

jobs:
  linux:
    name: deb (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build deb
        run: |
          chmod +x gradlew
          ./gradlew packageDeb
          cp build/compose/binaries/main/deb/pgpony_*_amd64.deb PGPony-linux.deb

      # jpackage writes its real error to a log file and Gradle only prints the path, so a
      # failure here otherwise says nothing but "exit code 1". Without this the only way to see
      # what jpackage actually objected to is to guess and re-tag.
      - name: jpackage logs on failure
        if: failure()
        run: |
          for f in build/compose/logs/packageDeb/*.txt; do
            echo "===== $f ====="
            cat "$f"
          done

      # build.gradle.kts injects --linux-package-deps through the jpackage task's freeArgs, and
      # that lookup degrades to a silent no-op if the property ever moves. A green build proves
      # nothing here; this is the check that would notice, and hardware keys are dead without it.
      - name: Verify deb declares its pcsc dependency
        run: |
          dpkg-deb -f PGPony-linux.deb Depends
          dpkg-deb -f PGPony-linux.deb Depends | grep -q pcsc

      # The OS half of the D9 file-association work. The .desktop entry must claim the types, or
      # the routing DesktopFileRouter already implements never gets handed a file.
      - name: Verify deb registers the file associations
        run: |
          dpkg-deb -c PGPony-linux.deb | grep -E '\.desktop$' || true
          mkdir -p /tmp/debx && dpkg-deb -x PGPony-linux.deb /tmp/debx
          grep -rh "MimeType" /tmp/debx --include=*.desktop || echo "NO MimeType FOUND"

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: PGPony-linux.deb

  windows:
    name: msi (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure WiX Toolset 3.x (jpackage needs candle.exe/light.exe)
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
            $wix = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset v3*' -Directory | Select-Object -Last 1
            if ($wix) { Join-Path $wix.FullName 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }
          }

      - name: Build msi
        shell: pwsh
        run: |
          ./gradlew.bat packageMsi
          Copy-Item build/compose/binaries/main/msi/PGPony-*.msi PGPony-windows.msi

      # jpackage writes its real error to a log file and Gradle prints only the path, so a failure
      # here otherwise says nothing but "exit code 1". The Linux job grew this step first; not
      # carrying it across cost a blind round trip on the very next Windows failure.
      - name: jpackage logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem build/compose/logs/packageMsi/*.txt -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.FullName) ====="
            Get-Content $_.FullName
          }

      # Three assertions, each for a bug that shipped in 1.0.0 while the build was green.
      #
      #  1. java.smartcardio in the bundled runtime. D12 warned that a wrong module name would
      #     silently drop card support from the jlink image; the macOS image was verified and
      #     Windows was not, on the assumption that one platform covered all three.
      #  2. Both launchers present. The console pgpony-cli.exe comes from --add-launcher, and if
      #     that freeArgs injection ever stops resolving it degrades to a silent no-op — exactly
      #     the failure mode --linux-package-deps has. It is pgpony-cli and not pgpony because
      #     Windows is case-insensitive and pgpony.exe collides with the GUI's PGPony.exe.
      #  3. The CLI actually PRINTS. 1.0.0's only launcher was GUI-subsystem, which on Windows has
      #     no stdout, so every verb ran and discarded its output. Nothing caught it because
      #     nothing ever ran the CLI.
      # Verified against the INSTALLED msi, not an intermediate build directory. packageMsi
      # builds into a jpackage temp image and leaves no app image behind (packageDmg does, which
      # is what misled the first version of this step), and --add-launcher is scoped to packageMsi
      # by task name so an intermediate would not carry pgpony-cli.exe regardless.
      #
      # Installing also makes this the clean-machine install that D13 never performed — the msi
      # goes in silently, gets inspected, and the job fails if any of it is wrong.
      - name: Install the msi and verify it
        shell: pwsh
        run: |
          $msi = (Resolve-Path PGPony-windows.msi).Path
          Write-Host "installing $msi"
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec failed with exit code $($p.ExitCode)" }

          $img = 'C:\Program Files\PGPony'
          if (-not (Test-Path $img)) {
            Write-Host 'Program Files contents:'
            Get-ChildItem 'C:\Program Files' -Directory | Select-Object -ExpandProperty Name
            throw "installed app not found at $img"
          }
          Write-Host "installed at $img"

          # 1. java.smartcardio in the bundled runtime. D12 warned that a wrong module name would
          #    silently drop card support from the jlink image; 1.0.0 verified the macOS image and
          #    not Windows, on the assumption one platform covered all three.
          $rel = Get-Content (Join-Path $img 'runtime/release') -Raw
          if ($rel -notmatch 'java\.smartcardio') { throw 'java.smartcardio is MISSING from the bundled runtime' }
          Write-Host 'java.smartcardio: present'

          # 2. Both launchers. pgpony-cli.exe comes from --add-launcher through freeArgs, which
          #    degrades to a silent no-op if that property ever moves.
          foreach ($exe in 'PGPony.exe', 'pgpony-cli.exe') {
            if (-not (Test-Path (Join-Path $img $exe))) { throw "launcher missing: $exe" }
          }
          Write-Host 'both launchers: present'

          # 3. The CLI actually PRINTS. 1.0.0 shipped only a GUI-subsystem launcher, which on
          #    Windows has no stdout, so every verb ran and discarded its output. Nothing caught
          #    it because nothing ever ran the CLI.
          $out = & (Join-Path $img 'pgpony-cli.exe') version 2>&1 | Out-String
          Write-Host "pgpony-cli version -> '$($out.Trim())'"
          if ([string]::IsNullOrWhiteSpace($out)) {
            throw 'pgpony-cli.exe printed nothing - the console subsystem was not applied'
          }

          # 4. card-info actually RUNS. Asserting on its real output, not on the absence of an
          #    error string: the first version of this check only looked for 'MISSING from this
          #    runtime', so it passed while card-info was silently falling through to Main.kt's
          #    usage text — the verb had been added to Cli's dispatch but not to Main's gate.
          #    A check that cannot fail on the actual bug is not a check.
          $ci = & (Join-Path $img 'pgpony-cli.exe') card-info 2>&1 | Out-String
          Write-Host "pgpony-cli card-info ->"
          Write-Host $ci
          if ($ci -notmatch 'smartcardio\s') { throw 'card-info did not run - no smartcardio line (fell through to usage?)' }
          if ($ci -notmatch 'readers\s')     { throw 'card-info did not report a readers line' }
          if ($ci -match  'MISSING from this runtime') { throw 'smartcardio did not resolve at runtime' }
          if ($ci -match  'Usage: pgpony')    { throw 'card-info fell through to the usage text' }

      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: PGPony-windows.msi

  draft:
    name: Open the draft release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p dist
          mv artifacts/deb/PGPony-linux.deb dist/
          mv artifacts/msi/PGPony-windows.msi dist/
          ls -l dist
          sha256sum dist/*

      # DRAFT, deliberately. A release published with two of its three installers missing, no
      # signatures and no SHA256SUMS would be visible to anyone watching the repo, and the site
      # would start linking assets that are not there yet. The draft stays invisible until the
      # local half is attached and it is published by hand.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/PGPony-linux.deb \
            dist/PGPony-windows.msi \
            --repo "${{ github.repository }}" \
            --title "PGPony Desktop ${{ github.ref_name }}" \
            --draft \
            --generate-notes
          echo "Draft created. Build and notarize the dmg, sign everything, attach, publish."
          echo "See RELEASING.md."
