name: Release

# Cut a release by pushing a version tag:
#   git tag v1.0.3 && git push origin v1.0.3
#
# CI builds everything that needs a machine you do not have — the Linux .deb, portable tarball
# and AppImage on both x86_64 and aarch64, and the Windows .msi — and opens a DRAFT release with
# them attached. The macOS .dmg, every PGP signature and the SHA256SUMS manifest are made on
# Kevin's Mac and attached by hand, then the draft is published. RELEASING.md has the local half.
#
# This split is the plan of record (§D0-5: "CI producing unsigned artifacts, signing done locally
# at release time"), and it is the reason this repository holds NO secrets. The Developer ID
# certificate never reaches a hosted runner, and neither does the PGP release key — which for an
# OpenPGP application signing its own releases is the whole point.
#
# The workflow triggers on tag pushes, and by hand (workflow_dispatch) for a test build: a manual
# run builds and checks the same artifacts and leaves them on the run page, but never opens a
# release, because the draft job runs only for a tag. There is nothing secret here for a fork PR
# to reach, but keep it that way regardless.
#
# Supply chain. Every action is pinned to a full commit SHA (the tag it was taken from is in the
# comment beside it), so a moved tag upstream cannot change what runs here. The token is
# read-only everywhere except the one job that opens the draft, and checkout does not leave it
# in .git/config while Gradle, its plugins and jpackage run. Tools downloaded at build time
# (appimagetool and its runtime) are pinned by version and sha256 in
# packaging/appimage/tools.pin and checked before they run. To move a pin, see RELEASING.md,
# "Pinned build inputs".

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One matrix, two architectures, ONE set of steps. Deliberately not two copied jobs: an arm64
  # lane that drifts from the x86_64 lane is how a second architecture ships with a verification
  # gap, and 1.0.0 already shipped a broken Windows CLI for exactly that reason — the check
  # existed on one platform and was assumed to cover the rest.
  #
  # jpackage cannot cross-compile, so each architecture genuinely needs its own native runner.
  # GitHub's ubuntu-24.04-arm runners are GA and free on public repositories.
  linux:
    name: deb + tarball + AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The x86_64 .deb keeps the name it has always had. Existing links to
          # PGPony-linux.deb must not break, so the arch suffix is only added to the new one.
          - arch: x86_64
            runner: ubuntu-latest
            debarch: amd64
            deb: PGPony-linux.deb
            tarball: PGPony-linux-x86_64.tar.gz
            appimage: PGPony-x86_64.AppImage
            artifact: linux-x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            debarch: arm64
            deb: PGPony-linux-arm64.deb
            tarball: PGPony-linux-aarch64.tar.gz
            appimage: PGPony-aarch64.AppImage
            artifact: linux-aarch64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # The committed gradle-wrapper.jar must be a published Gradle release, not something else.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      # desktop-file-utils supplies desktop-file-validate, which appimagetool runs against the
      # AppDir's .desktop and refuses to build without.
      - run: sudo apt-get update && sudo apt-get install -y fakeroot desktop-file-utils

      - name: Build deb and portable tarball
        run: |
          chmod +x gradlew
          ./gradlew packageDeb createDistributable
          cp build/compose/binaries/main/deb/pgpony_*_${{ matrix.debarch }}.deb ${{ matrix.deb }}
          # Wrap the tarball's launcher so it preloads the system libfreetype (issue #1: the JVM's
          # GTK file chooser draws blank otherwise, because Skiko's bundled FreeType interposes on
          # the system one). Done on a COPY, not the shared app image the AppImage below reuses —
          # that one carries its own AppRun preload, and wrapping it too would only double the
          # LD_PRELOAD.
          chmod +x tools/linux-wrap-launcher.sh
          rm -rf tarball-src && cp -r build/compose/binaries/main/app tarball-src
          tools/linux-wrap-launcher.sh tarball-src/PGPony
          tar -czf ${{ matrix.tarball }} -C tarball-src PGPony

      # jpackage writes its real error to a log file and Gradle only prints the path, so a
      # failure here otherwise says nothing but "exit code 1". Without this the only way to see
      # what jpackage actually objected to is to guess and re-tag.
      - name: jpackage logs on failure
        if: failure()
        run: |
          for f in build/compose/logs/*/*.txt; do
            echo "===== $f ====="
            cat "$f"
          done

      # Wrap the .deb's launcher the same way as the tarball (issue #1). packageDeb builds its own
      # app image, so this cannot ride on the tarball copy above — it has to happen on the packed
      # .deb: unpack, wrap, regenerate md5sums so integrity checks stay honest, repack with root
      # ownership. --root-owner-group keeps files root:root without needing fakeroot here.
      - name: Wrap the deb launcher
        run: |
          chmod +x tools/linux-wrap-launcher.sh
          rm -rf debwrap && mkdir debwrap
          dpkg-deb -R ${{ matrix.deb }} debwrap
          launcher=$(find debwrap -type f -path '*/bin/PGPony')
          approot=$(dirname "$(dirname "$launcher")")
          echo "deb app root -> $approot"
          tools/linux-wrap-launcher.sh "$approot"
          if [ -f debwrap/DEBIAN/md5sums ]; then
            ( cd debwrap && find . -type f ! -path './DEBIAN/*' -printf '%P\0' | xargs -0 md5sum > DEBIAN/md5sums )
          fi
          dpkg-deb --root-owner-group -b debwrap ${{ matrix.deb }}

      # build.gradle.kts injects --linux-package-deps through the jpackage task's freeArgs, and
      # that lookup degrades to a silent no-op if the property ever moves. A green build proves
      # nothing here; this is the check that would notice, and hardware keys are dead without it.
      - name: Verify deb declares its pcsc dependency
        run: |
          dpkg-deb -f ${{ matrix.deb }} Depends
          dpkg-deb -f ${{ matrix.deb }} Depends | grep -q pcsc

      # The OS half of the D9 file-association work: the .desktop entry must claim the types or
      # the routing DesktopFileRouter already implements never gets handed a file.
      #
      # This assertion used to end in `|| echo "NO MimeType FOUND"`, which made it incapable of
      # failing — it printed a scary string and returned 0. Same defect class as the card-info
      # check that passed while card-info was falling through to the usage text. A check that
      # cannot fail on the bug it names is not a check.
      - name: Verify deb registers the file associations
        run: |
          rm -rf /tmp/debx && mkdir -p /tmp/debx
          dpkg-deb -x ${{ matrix.deb }} /tmp/debx
          grep -rh MimeType /tmp/debx --include=*.desktop
          grep -rq 'MimeType=.*pgp' /tmp/debx --include=*.desktop
          # issue #1 — the installed launcher must be the FreeType-preload wrapper, same assertion
          # the tarball gets. The real jpackage binary is renamed to PGPony.bin beside it.
          wrapped=$(find /tmp/debx -type f -path '*/bin/PGPony')
          head -n1 "$wrapped" | grep -q '^#!/bin/sh'
          test -f "$(dirname "$wrapped")/PGPony.bin"

      # The tarball is a NEW distribution channel with no installer to vouch for it, so it gets
      # the checks the .deb gets for free. Running the CLI out of the extracted tree is the
      # Linux counterpart of the Windows "pgpony-cli actually prints" assertion — 1.0.0 shipped
      # a platform whose CLI was silently mute because nothing ever ran it.
      - name: Verify the portable tarball
        run: |
          rm -rf /tmp/tarcheck && mkdir -p /tmp/tarcheck
          tar -xzf ${{ matrix.tarball }} -C /tmp/tarcheck
          test -x /tmp/tarcheck/PGPony/bin/PGPony
          # issue #1 — the launcher must be the FreeType-preload wrapper, with the real jpackage
          # binary renamed beside it. A check that would notice if the wrap step ever silently
          # stopped running and the blank-file-chooser bug came back.
          head -n1 /tmp/tarcheck/PGPony/bin/PGPony | grep -q '^#!/bin/sh'
          test -x /tmp/tarcheck/PGPony/bin/PGPony.bin
          # The runtime's location is NOT the same across platforms: jpackage puts it at
          # <app>/runtime on Windows, <app>/lib/runtime on Linux and Contents/runtime on macOS.
          # The first version of this step hardcoded the Windows path and failed on both Linux
          # legs while the tarball itself was perfectly good. Locate it instead of assuming, and
          # echo the path so the log records the real layout rather than leaving it folklore.
          rel=$(find /tmp/tarcheck/PGPony -path '*runtime*' -name release -type f | head -1)
          echo "runtime release file -> ${rel:-NONE FOUND}"
          test -n "$rel"
          grep -q 'java\.smartcardio' "$rel"
          out=$(/tmp/tarcheck/PGPony/bin/PGPony version 2>&1)
          echo "bin/PGPony version -> $out"
          test -n "$out"

      # appimagetool and the type2 runtime it puts at the front of every AppImage are fetched at
      # the versions pinned in packaging/appimage/tools.pin and refused unless their sha256 matches
      # the pin. The runtime is the first code that runs on a user's machine, so it is passed in
      # explicitly with --runtime-file; without it appimagetool downloads whatever the upstream
      # "continuous" release holds at build time.
      - name: Fetch and verify appimagetool and its runtime
        run: |
          . packaging/appimage/tools.pin
          case "${{ matrix.arch }}" in
            x86_64)  TOOL_SHA="$APPIMAGETOOL_X86_64_SHA256";  RUNTIME_SHA="$RUNTIME_X86_64_SHA256" ;;
            aarch64) TOOL_SHA="$APPIMAGETOOL_AARCH64_SHA256"; RUNTIME_SHA="$RUNTIME_AARCH64_SHA256" ;;
            *) echo "no pin for ${{ matrix.arch }}"; exit 1 ;;
          esac
          for sum in "$TOOL_SHA" "$RUNTIME_SHA"; do
            if ! printf '%s' "$sum" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "packaging/appimage/tools.pin has no sha256 for ${{ matrix.arch }} yet."
              echo "Run packaging/appimage/pin-tools.sh and commit the result (RELEASING.md, Pinned build inputs)."
              exit 1
            fi
          done
          mkdir -p appimage-tools
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o appimage-tools/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${{ matrix.arch }}.AppImage"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o appimage-tools/runtime \
            "https://github.com/AppImage/type2-runtime/releases/download/${TYPE2_RUNTIME_VERSION}/runtime-${{ matrix.arch }}"
          printf '%s  %s\n%s  %s\n' "$TOOL_SHA" appimage-tools/appimagetool "$RUNTIME_SHA" appimage-tools/runtime | sha256sum -c -
          chmod +x appimage-tools/appimagetool

      # AppRun and the .desktop are COMMITTED files copied in, never heredocs written inline.
      # A YAML block scalar re-indents its content, and a shell script whose shebang line
      # arrives with leading whitespace cannot be exec'd at all.
      #
      # --appimage-extract-and-run is what lets appimagetool work on a runner: it unpacks itself
      # rather than mounting, and hosted runners have no FUSE.
      - name: Build AppImage
        run: |
          APPDIR=PGPony.AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR"
          cp -r build/compose/binaries/main/app/PGPony/* "$APPDIR/"
          cp packaging/appimage/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          cp packaging/appimage/pgpony.desktop "$APPDIR/pgpony.desktop"
          cp packaging/pgpony.png "$APPDIR/pgpony.png"
          ARCH=${{ matrix.arch }} ./appimage-tools/appimagetool --appimage-extract-and-run \
            --runtime-file appimage-tools/runtime "$APPDIR" ${{ matrix.appimage }}
          rm -rf appimage-tools

      # --appimage-extract needs no FUSE either, so the produced image can be opened and its
      # entry point actually executed. This proves AppRun's exec path resolves inside the
      # bundle, which is the one thing a committed-vs-generated AppRun mistake would break.
      - name: Verify the AppImage runs
        run: |
          chmod +x ${{ matrix.appimage }}
          rm -rf squashfs-root
          ./${{ matrix.appimage }} --appimage-extract > /dev/null
          test -x squashfs-root/AppRun
          out=$(./squashfs-root/AppRun version 2>&1)
          echo "AppRun version -> $out"
          test -n "$out"
          rm -rf squashfs-root

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.deb }}
            ${{ matrix.tarball }}
            ${{ matrix.appimage }}

  windows:
    name: msi (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to one version. Chocolatey checks the installer it downloads against the checksum
      # in that package version, so the pin also fixes the installer bytes.
      - name: Ensure WiX Toolset 3.x (jpackage needs candle.exe/light.exe)
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version 3.14.1 -y --no-progress
            $wix = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset v3*' -Directory | Select-Object -Last 1
            if ($wix) { Join-Path $wix.FullName 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }
          }

      - name: Build msi
        shell: pwsh
        run: |
          ./gradlew.bat packageMsi
          Copy-Item build/compose/binaries/main/msi/PGPony-*.msi PGPony-windows.msi

      # jpackage writes its real error to a log file and Gradle prints only the path, so a failure
      # here otherwise says nothing but "exit code 1". The Linux job grew this step first; not
      # carrying it across cost a blind round trip on the very next Windows failure.
      - name: jpackage logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem build/compose/logs/packageMsi/*.txt -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.FullName) ====="
            Get-Content $_.FullName
          }

      # Four assertions, each for a bug that shipped in 1.0.0 or 1.0.1 while the build was green.
      # Verified against the INSTALLED msi, not an intermediate build directory: packageMsi
      # builds into a jpackage temp image and leaves no app image behind (packageDmg does, which
      # is what misled the first version of this step). Installing also makes this the
      # clean-machine install the release checklist otherwise never performs.
      - name: Install the msi and verify it
        shell: pwsh
        run: |
          $msi = (Resolve-Path PGPony-windows.msi).Path
          Write-Host "installing $msi"
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec failed with exit code $($p.ExitCode)" }

          $img = 'C:\Program Files\PGPony'
          if (-not (Test-Path $img)) {
            Write-Host 'Program Files contents:'
            Get-ChildItem 'C:\Program Files' -Directory | Select-Object -ExpandProperty Name
            throw "installed app not found at $img"
          }
          Write-Host "installed at $img"

          # 1. java.smartcardio in the bundled runtime. D12 warned that a wrong module name would
          #    silently drop card support from the jlink image; 1.0.0 verified the macOS image and
          #    not Windows, on the assumption one platform covered all three.
          $rel = Get-Content (Join-Path $img 'runtime/release') -Raw
          if ($rel -notmatch 'java\.smartcardio') { throw 'java.smartcardio is MISSING from the bundled runtime' }
          Write-Host 'java.smartcardio: present'

          # 2. Both launchers. pgpony-cli.exe comes from --add-launcher through freeArgs, which
          #    degrades to a silent no-op if that property ever moves.
          foreach ($exe in 'PGPony.exe', 'pgpony-cli.exe') {
            if (-not (Test-Path (Join-Path $img $exe))) { throw "launcher missing: $exe" }
          }
          Write-Host 'both launchers: present'

          # 3. The CLI actually PRINTS. 1.0.0 shipped only a GUI-subsystem launcher, which on
          #    Windows has no stdout, so every verb ran and discarded its output.
          $out = & (Join-Path $img 'pgpony-cli.exe') version 2>&1 | Out-String
          Write-Host "pgpony-cli version -> '$($out.Trim())'"
          if ([string]::IsNullOrWhiteSpace($out)) {
            throw 'pgpony-cli.exe printed nothing - the console subsystem was not applied'
          }

          # 4. card-info actually RUNS. Asserting on its real output, not on the absence of an
          #    error string: the first version of this check only looked for 'MISSING from this
          #    runtime', so it passed while card-info was silently falling through to Main.kt's
          #    usage text — the verb had been added to Cli's dispatch but not to Main's gate.
          $ci = & (Join-Path $img 'pgpony-cli.exe') card-info 2>&1 | Out-String
          Write-Host "pgpony-cli card-info ->"
          Write-Host $ci
          if ($ci -notmatch 'smartcardio\s') { throw 'card-info did not run - no smartcardio line (fell through to usage?)' }
          if ($ci -notmatch 'readers\s')     { throw 'card-info did not report a readers line' }
          if ($ci -match  'MISSING from this runtime') { throw 'smartcardio did not resolve at runtime' }
          if ($ci -match  'Usage: pgpony')    { throw 'card-info fell through to the usage text' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msi
          path: PGPony-windows.msi

  draft:
    name: Open the draft release
    # Naming the matrix job once waits for BOTH of its legs.
    needs: [linux, windows]
    # A manual test build stops at the artifacts: no release, draft or otherwise.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p dist
          mv artifacts/linux-x86_64/PGPony-linux.deb dist/
          mv artifacts/linux-x86_64/PGPony-linux-x86_64.tar.gz dist/
          mv artifacts/linux-x86_64/PGPony-x86_64.AppImage dist/
          mv artifacts/linux-aarch64/PGPony-linux-arm64.deb dist/
          mv artifacts/linux-aarch64/PGPony-linux-aarch64.tar.gz dist/
          mv artifacts/linux-aarch64/PGPony-aarch64.AppImage dist/
          mv artifacts/msi/PGPony-windows.msi dist/
          ls -l dist
          ( cd dist && sha256sum * ) | tee CI-SHA256SUMS

      # What CI built, by hash, kept with the run. RELEASING.md section 4 checks the files it
      # downloads against this list before anything is signed.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-sha256sums
          path: CI-SHA256SUMS

      # DRAFT, deliberately. A release published without the dmg, without signatures and without
      # SHA256SUMS would be visible to anyone watching the repo, and the site would start linking
      # assets that are not there yet. The draft stays invisible until the local half is attached
      # and it is published by hand.
      #
      # Note for anything relying on releases/latest/download/...: those URLs resolve only once
      # this draft is PUBLISHED and marked latest. Until then they serve the previous release.
      # Re-pushing a tag is a normal thing to do — a botched tag, a fix after CI fails — and a
      # bare `gh release create` fails outright when a release for that tag already exists,
      # taking this job red for a reason that has nothing to do with the build. Clear any
      # existing DRAFT for this tag first. A published release is left alone deliberately:
      # deleting one out from under users is not something a workflow should do unattended.
      - name: Clear any stale draft for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" \
               --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            echo "deleting stale draft for ${{ github.ref_name }}"
            gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes
          else
            echo "no draft to clear"
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/PGPony-linux.deb \
            dist/PGPony-linux-x86_64.tar.gz \
            dist/PGPony-x86_64.AppImage \
            dist/PGPony-linux-arm64.deb \
            dist/PGPony-linux-aarch64.tar.gz \
            dist/PGPony-aarch64.AppImage \
            dist/PGPony-windows.msi \
            --repo "${{ github.repository }}" \
            --title "PGPony Desktop ${{ github.ref_name }}" \
            --draft \
            --generate-notes
          echo "Draft created. Build and notarize the dmg, sign everything, attach, publish."
          echo "See RELEASING.md."
