ShortDescription: OpenPGP for the desktop - encrypt, decrypt, sign, verify, manage your keys
Description: >-
  PGPony is an OpenPGP application for macOS, Linux and Windows, and the desktop member of
  the PGPony family. Encrypt, decrypt, sign and verify messages and files, manage your
  keyring, and use a hardware security key over USB - all on device, with no accounts, no
  ads, no analytics and no tracking.

  It compiles the exact OpenPGP engine the PGPony phone apps ship, including v4 and v6
  (RFC 9580) keys, post-quantum ML-KEM composite encryption in both wire formats, the
  OpenPGP smart-card protocol stack and PGP/MIME, so keys, messages and encrypted backups
  move between your phone and your computer without a compatibility story. It also ships
  the pgpony command line, which shares the application keyring.

  The Java runtime is bundled; nothing else needs installing.
