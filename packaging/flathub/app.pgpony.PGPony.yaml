# Flatpak manifest for PGPony Desktop (3.0.0, plan section 13a). See README.md beside it.
#
# The build is offline, as Flathub requires: the Gradle distribution is an archive source, and
# every Maven artifact the build needs is listed in gradle-sources.json (generated by
# gradle-cache-sources.py from an online build's Gradle cache; x86_64 and aarch64 natives both).
# offline.init.gradle points Gradle at the repository those sources are downloaded into.
#
# The app image is Compose's createDistributable, the same jpackage image the .deb, tarball and
# AppImage ship, with its jlink runtime built here from the OpenJDK 17 SDK extension. Nothing
# prebuilt goes in.
app-id: app.pgpony.PGPony
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17
command: pgpony

finish-args:
  # Keyserver, WKD and VKS lookups, and the Tor or SOCKS proxy. It also lets the git shim, which
  # git starts through `flatpak run`, reach the running app over loopback (ShimBridge).
  - --share=network
  # Compose Desktop draws through AWT, which is X11 only on JDK 17 (XWayland on a Wayland
  # session). IPC is the X11 shared-memory requirement.
  - --socket=x11
  - --share=ipc
  - --device=dri
  # Smart cards over PC/SC: the host pcscd's socket. The client library is the pcsc-lite module
  # below; Flatpak.kt points javax.smartcardio at it.
  - --socket=pcsc
  # PGPony encrypts, decrypts, signs and verifies files and folders the user picks, and watch
  # folders process whole directories on their own. The AWT file chooser does not go through the
  # file chooser portal, so the grant is home rather than a portal.
  - --filesystem=home

modules:
  # The PC/SC client library only; pcscd itself runs on the host.
  - name: pcsc-lite
    buildsystem: meson
    config-opts:
      - -Dlibudev=false
      - -Dlibsystemd=false
      - -Dpolkit=false
    post-install:
      - rm -f /app/sbin/pcscd
      - rmdir /app/sbin || true
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/libpcsclite.so
      - /lib/libpcscspy.so*
      - /bin/pcsc-spy
      - /lib/systemd
      - /share/man
      - /share/doc
      # pcsc-lite's own AppStream file and daemon config; the app's metainfo is the only one.
      - /share/metainfo/fr.apdu.pcsclite.metainfo.xml
      - /etc/default/pcscd
      - /sysusers.d
    sources:
      - type: archive
        url: https://pcsclite.apdu.fr/files/pcsc-lite-2.5.2.tar.xz
        sha256: 60a08942d8c00a1d86a3bf4c64eddbf7a5569c7c54f6904e3f07801bb5316acd
        x-checker-data:
          type: anitya
          project-id: 2611
          url-template: https://pcsclite.apdu.fr/files/pcsc-lite-$version.tar.xz

  - name: pgpony
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/openjdk17/bin
      env:
        JAVA_HOME: /usr/lib/sdk/openjdk17/jvm/openjdk-17
        GRADLE_USER_HOME: /run/build/pgpony/gradle-home
    build-commands:
      # Gradle settings for this build only (heap, in-process Kotlin compile). GRADLE_USER_HOME
      # properties take precedence over the project's gradle.properties.
      - install -Dm644 packaging/flathub/gradle.properties gradle-home/gradle.properties
      - gradle-dist/bin/gradle --offline --no-daemon --console=plain
        --init-script packaging/flathub/offline.init.gradle createDistributable
      - cp -a build/compose/binaries/main/app/PGPony /app/pgpony
      - install -Dm755 packaging/flathub/pgpony-launcher /app/bin/pgpony
      - install -Dm755 packaging/flathub/pgpony-gpg /app/bin/pgpony-gpg
      - install -Dm755 packaging/flathub/pgpony-sop /app/bin/pgpony-sop
      - install -Dm644 packaging/flathub/app.pgpony.PGPony.desktop
        /app/share/applications/app.pgpony.PGPony.desktop
      - install -Dm644 packaging/flathub/app.pgpony.PGPony.metainfo.xml
        /app/share/metainfo/app.pgpony.PGPony.metainfo.xml
      - install -Dm644 packaging/flathub/app.pgpony.PGPony.mime.xml
        /app/share/mime/packages/app.pgpony.PGPony.xml
      - install -Dm644 packaging/pgpony.png
        /app/share/icons/hicolor/512x512/apps/app.pgpony.PGPony.png
    sources:
      # Local iteration: the working tree. For the Flathub submission this becomes a git source
      # pinned to the release tag and its commit (README.md, "Submit").
      - type: dir
        path: ../..
        skip:
          - .git
          - .gradle
          - .flatpak-builder
          - build
          - _to_delete
          - issues
      - type: archive
        url: https://services.gradle.org/distributions/gradle-9.4.1-bin.zip
        sha256: 2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb
        dest: gradle-dist
      # Generated, see README.md. Regenerate whenever Gradle or a dependency changes.
      - gradle-sources.json
