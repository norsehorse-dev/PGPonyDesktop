// generate-sources.init.gradle: writes packaging/flathub/gradle-sources.json, the list of every
// Maven artifact the Flatpak build needs, with its URL and checksum, so flatpak-builder can fetch
// them before an offline build. Run on Linux x86_64 with network access (README.md, step 2):
//
//   ./gradlew --no-configuration-cache --init-script packaging/flathub/generate-sources.init.gradle flatpakGradleGenerator
//
// It applies the flatpak-gradle-generator plugin (the one flatpak-builder-tools recommends) from
// here, so the project's own build never declares it. An init script cannot apply a plugin from
// its classpath by id, so the implementation class is read from the plugin's descriptor.
//
// Linux x86_64, because compose.desktop.currentOs and the Skiko runtime resolve for the machine
// that runs this; flathub.json limits the Flatpak to that architecture to match.

initscript {
    repositories {
        gradlePluginPortal()
    }
    dependencies {
        classpath 'io.github.jwharm.flatpak-gradle-generator:io.github.jwharm.flatpak-gradle-generator.gradle.plugin:1.8.0'
    }
}

def generatorId = 'io.github.jwharm.flatpak-gradle-generator'
def loader = getClass().classLoader
def descriptor = new Properties()
loader.getResourceAsStream("META-INF/gradle-plugins/${generatorId}.properties").withCloseable { descriptor.load(it) }
def generatorClass = loader.loadClass(descriptor.getProperty('implementation-class'))

rootProject {
    apply plugin: generatorClass
    tasks.named('flatpakGradleGenerator') {
        outputFile = file('packaging/flathub/gradle-sources.json')
        downloadDirectory = './offline-repository'
        excludeConfigurations = ['testCompileClasspath', 'testRuntimeClasspath']
    }
}
