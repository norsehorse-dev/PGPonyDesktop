# Gradle settings for the Flatpak build only (app.pgpony.PGPony.yaml installs this file as the
# build's GRADLE_USER_HOME/gradle.properties, which takes precedence over the project's).
#
# The Kotlin compiler runs inside the Gradle process rather than in a separate compile daemon,
# so the one heap below has to hold both. The project's own gradle.properties gives the Kotlin
# daemon 4 GB for a clean compile; this gives the Gradle process the same.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
