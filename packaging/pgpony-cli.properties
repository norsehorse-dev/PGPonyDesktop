# jpackage --add-launcher properties for the console-mode CLI. Wired up in build.gradle.kts,
# scoped to packageMsi.
#
# win-console=true builds a CONSOLE-subsystem pgpony-cli.exe, so `pgpony-cli list-keys` actually
# prints. The launcher is pgpony-cli and not pgpony because Windows filesystems are
# case-insensitive: `pgpony.exe` and the GUI's `PGPony.exe` are the same filename, and jpackage
# fails with FileAlreadyExistsException.
# 1.0.0 shipped only the GUI-subsystem PGPony.exe, which on Windows has no stdout at all: every
# CLI verb ran and silently discarded its output.
#
# Setting Compose's windows { console = true } instead would have attached a console window to the
# GUI app as well — a black window flashing up behind the app is worse than the bug being fixed.
# Two launchers keeps each one honest.
#
# main-jar, main-class and app-version are deliberately omitted: an added launcher inherits them
# from the main application, so this file cannot drift from whatever Compose configures.
win-console=true
