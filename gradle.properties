# PGPonyDesktop build properties.
#
# Added in D13. The project had none, which worked only because day-to-day builds are incremental:
# `clean build` pushes all 165 Kotlin files (121 vendored from PGPonyAndroid + 44 desktop) through
# one non-incremental compile and the Kotlin daemon's default heap does not cover it —
# `java.lang.OutOfMemoryError: GC overhead limit exceeded` out of :compileKotlin. Every CI run is a
# clean build, so this would have failed on the first run of .github/workflows/build.yml.
#
# org.gradle.jvmargs sizes the GRADLE daemon; kotlin.daemon.jvmargs sizes the KOTLIN COMPILE daemon,
# which is a separate process and the one that actually ran out. Setting only the first — the shape
# PGPonyAndroid uses, where the Android plugin makes the Gradle daemon the hungry one — would not
# have fixed this.
#
# Values are chosen for the SMALLEST machine that has to run them: GitHub's macos arm64 runner has
# roughly 7 GB, so a combined worst-case peak of ~6 GB leaves headroom for jlink and jpackage. They
# are a starting point, not a measurement; the first CI run is what tests them.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# UTF-8 is load-bearing, not hygiene: six locales ship in this repo and the Japanese strings.xml is
# CJK throughout.
kotlin.code.style=official
